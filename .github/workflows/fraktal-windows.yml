name: fraktal-windows

# [fraktal] The fork's own CI. Upstream's `blocking-ci` family is deliberately
# not used: it fans out to Bazel, the SDK, cargo-deny and a multi-platform
# matrix, much of which needs secrets and self-hosted runner groups this fork
# does not have. It also only triggers on `main`, while our work lands on
# `fraktal/main`, which is why nothing has ever run here.
#
# This builds the one artifact we ship — `fraktal.exe` for Windows — and runs
# lint plus tests for the crates the fork actually modifies.

on:
  push:
    branches: [fraktal/main]
    tags: ["fraktal-v*"]
  pull_request:
    branches: [fraktal/main]
  workflow_dispatch:

concurrency:
  # Supersede in-flight runs for a branch, but never cancel a tag build.
  group: fraktal-windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Upstream's async tests overflow the default thread stack on Windows and
  # abort the whole test binary with STATUS_STACK_OVERFLOW.
  RUST_MIN_STACK: "67108864"

jobs:
  check:
    name: Lint and test
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: fraktal-cargo-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}
          restore-keys: fraktal-cargo-${{ runner.os }}-

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # `--workspace` is intentionally avoided: it pulls in `code-mode-runtime`
      # and `v8-poc`, and the `v8` crate has no prebuilt archive for
      # x86_64-pc-windows-msvc, so the build fails before reaching our code.
      # This list is every crate the fork patches — regenerate it with:
      #   git diff --name-only upstream/main..HEAD -- 'codex-rs/**' \
      #     | sed 's#codex-rs/\([^/]*\)/.*#\1#' | sort -u
      - name: cargo clippy
        run: |
          cargo clippy --locked --all-targets \
            -p codex-cli -p codex-core -p codex-api -p codex-tools \
            -p codex-config -p codex-mcp -p codex-login -p codex-features \
            -p codex-otel -p codex-app-server -p codex-tui \
            -p codex-model-provider -p codex-model-provider-info \
            -p codex-models-manager -p codex-utils-home-dir

      # NOTE: `codex-tui` is linted above but deliberately NOT tested here.
      # The splash rebrand shifted ~19 insta snapshots that have not been
      # regenerated yet, so `cargo test -p codex-tui` fails on known-stale
      # expectations rather than real breakage. Tracked in FRAKTAL_TODO.md;
      # add `-p codex-tui` below once `cargo insta accept -p codex-tui` lands.
      - name: cargo test
        run: |
          cargo test --locked --lib \
            -p codex-core -p codex-api -p codex-tools \
            -p codex-config -p codex-mcp -p codex-login -p codex-features \
            -p codex-otel -p codex-app-server \
            -p codex-model-provider -p codex-model-provider-info \
            -p codex-models-manager -p codex-utils-home-dir

  build:
    name: Build fraktal.exe
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: codex-rs
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0

      - name: Cache cargo registry
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: fraktal-cargo-${{ runner.os }}-${{ hashFiles('codex-rs/Cargo.lock') }}
          restore-keys: fraktal-cargo-${{ runner.os }}-

      - name: cargo build --release
        run: cargo build --release --locked -p codex-cli --bin fraktal

      # Catches a binary that links but cannot start, and asserts the rebrand
      # (clap takes the version line from `name`, not `bin_name`).
      - name: Smoke test
        run: |
          ./target/release/fraktal.exe --version | tee version.txt
          grep -q '^fraktal ' version.txt
          ./target/release/fraktal.exe --help | head -1 | grep -q '^Fraktal CLI'

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v5.0.0
        with:
          name: fraktal-x86_64-pc-windows-msvc
          path: codex-rs/target/release/fraktal.exe
          if-no-files-found: error
          retention-days: 30
